<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AETHER Omni | React 18 & Tailwind Universal App</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- AETHER Universal Native Bridge -->
  <script src="aether_bridge.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #090d16;
      color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
    }
    code, pre {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-slate-950">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('hardware');
      const [toastMsg, setToastMsg] = useState('Welcome to AETHER Omni Native!');
      const [deviceInfo, setDeviceInfo] = useState(null);
      const [aiPrompt, setAiPrompt] = useState('Optimize database query and summarize telemetry.');
      const [aiResponse, setAiResponse] = useState('');
      const [isAiLoading, setIsAiLoading] = useState(false);
      const [dbRecords, setDbRecords] = useState([
        { id: 1, task: "Zero-SDK Android APK Compiler", latency: "0.2ms", status: "Verified" },
        { id: 2, task: "AetherBridge React 18 Container", latency: "0.1ms", status: "Active" },
        { id: 3, task: "Native Relational SQL Engine", latency: "0.04ms", status: "Operational" }
      ]);
      const [newTask, setNewTask] = useState('');

      useEffect(() => {
        if (window.Aether) {
          window.Aether.deviceInfo().then(info => setDeviceInfo(info));
        }
      }, []);

      const triggerHaptic = (type) => {
        if (window.Aether) {
          window.Aether.hapticFeedback(type);
        }
      };

      const showNotification = () => {
        if (window.Aether) {
          window.Aether.showToast(toastMsg);
        }
      };

      const handleRunAi = async () => {
        setIsAiLoading(true);
        triggerHaptic('light');
        if (window.Aether) {
          const res = await window.Aether.ai(aiPrompt);
          setAiResponse(res.response);
        }
        setIsAiLoading(false);
      };

      const handleAddRecord = (e) => {
        e.preventDefault();
        if (!newTask.trim()) return;
        triggerHaptic('medium');
        const newEntry = {
          id: dbRecords.length + 1,
          task: newTask.trim(),
          latency: "0.05ms",
          status: "Saved"
        };
        setDbRecords([...dbRecords, newEntry]);
        setNewTask('');
        if (window.Aether) {
          window.Aether.showToast("Record saved to AETHER SQL Engine!");
        }
      };

      return (
        <div class="max-w-3xl mx-auto w-full px-4 py-8 flex flex-col gap-6">
          {/* Header Card */}
          <header class="bg-gradient-to-br from-slate-900/90 via-slate-800/80 to-slate-900/90 border border-slate-700/60 rounded-3xl p-6 shadow-2xl backdrop-blur-xl relative overflow-hidden">
            <div class="absolute -right-12 -top-12 w-48 h-48 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="flex items-center justify-between flex-wrap gap-4 relative z-10">
              <div class="flex items-center gap-4">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-3xl shadow-lg shadow-cyan-500/20">
                  ⚡
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    <h1 class="text-2xl font-extrabold tracking-tight text-white">AETHER Omni</h1>
                    <span class="px-2.5 py-0.5 text-xs font-bold rounded-full bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">React 18</span>
                    <span class="px-2.5 py-0.5 text-xs font-bold rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/30">Tailwind</span>
                  </div>
                  <p class="text-sm text-slate-400 mt-0.5">Zero-SDK Universal Native Multi-Platform Application</p>
                </div>
              </div>

              <div class="flex items-center gap-2 bg-slate-950/60 px-4 py-2 rounded-2xl border border-slate-800 text-xs">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="font-semibold text-slate-300">Target:</span>
                <span class="text-emerald-400 font-bold uppercase">{deviceInfo?.platform || "Universal"}</span>
              </div>
            </div>

            {/* Zero-SDK Banner */}
            <div class="mt-6 bg-slate-950/80 rounded-2xl p-4 border border-cyan-500/20 flex items-center justify-between flex-wrap gap-3">
              <div class="flex items-center gap-3">
                <span class="text-xl">🏆</span>
                <div class="text-xs">
                  <span class="font-bold text-white">Zero Android Studio & Zero External SDKs:</span>
                  <span class="text-slate-400 ml-1">Pure Rust synthesizes Dalvik DEX, AXML & ZIP directly into signed APK in &lt;1 second.</span>
                </div>
              </div>
              <span class="text-xs font-semibold text-cyan-400 bg-cyan-950/50 px-3 py-1 rounded-lg border border-cyan-800/40">
                AetherShell 2.0
              </span>
            </div>
          </header>

          {/* Navigation Tabs */}
          <nav class="flex gap-2 p-1.5 bg-slate-900/80 rounded-2xl border border-slate-800">
            <button
              onClick={() => { triggerHaptic('light'); setActiveTab('hardware'); }}
              class={`flex-1 py-2.5 px-4 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 ${
                activeTab === 'hardware'
                  ? 'bg-cyan-500 text-slate-950 shadow-md shadow-cyan-500/20'
                  : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
              }`}
            >
              <span>📳</span> Native Hardware & Haptics
            </button>
            <button
              onClick={() => { triggerHaptic('light'); setActiveTab('db'); }}
              class={`flex-1 py-2.5 px-4 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 ${
                activeTab === 'db'
                  ? 'bg-cyan-500 text-slate-950 shadow-md shadow-cyan-500/20'
                  : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
              }`}
            >
              <span>🗄️</span> Relational SQL Engine
            </button>
            <button
              onClick={() => { triggerHaptic('light'); setActiveTab('ai'); }}
              class={`flex-1 py-2.5 px-4 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 ${
                activeTab === 'ai'
                  ? 'bg-cyan-500 text-slate-950 shadow-md shadow-cyan-500/20'
                  : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
              }`}
            >
              <span>🤖</span> Autonomous AI
            </button>
          </nav>

          {/* Tab 1: Hardware & Haptics */}
          {activeTab === 'hardware' && (
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 flex flex-col gap-4">
                <h3 class="text-sm font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
                  <span>📳</span> Native Haptic Feedback
                </h3>
                <p class="text-xs text-slate-400">
                  Trigger physical Android device vibrator motors directly from React component state via AetherBridge.
                </p>
                <div class="grid grid-cols-3 gap-2 mt-2">
                  <button
                    onClick={() => triggerHaptic('light')}
                    class="bg-slate-800 hover:bg-slate-700 active:bg-cyan-500 active:text-slate-950 text-slate-200 font-semibold py-3 px-3 rounded-2xl text-xs border border-slate-700 transition flex flex-col items-center gap-1 shadow"
                  >
                    <span class="text-lg">⚡</span>
                    Light (25ms)
                  </button>
                  <button
                    onClick={() => triggerHaptic('medium')}
                    class="bg-slate-800 hover:bg-slate-700 active:bg-cyan-500 active:text-slate-950 text-slate-200 font-semibold py-3 px-3 rounded-2xl text-xs border border-slate-700 transition flex flex-col items-center gap-1 shadow"
                  >
                    <span class="text-lg">⚡⚡</span>
                    Medium (45ms)
                  </button>
                  <button
                    onClick={() => triggerHaptic('heavy')}
                    class="bg-slate-800 hover:bg-slate-700 active:bg-cyan-500 active:text-slate-950 text-slate-200 font-semibold py-3 px-3 rounded-2xl text-xs border border-slate-700 transition flex flex-col items-center gap-1 shadow"
                  >
                    <span class="text-lg">💥</span>
                    Heavy (80ms)
                  </button>
                </div>

                <div class="border-t border-slate-800/80 pt-4 mt-2">
                  <h4 class="text-xs font-semibold text-slate-300 mb-2">Native Android Toast Notification</h4>
                  <div class="flex gap-2">
                    <input
                      type="text"
                      value={toastMsg}
                      onChange={(e) => setToastMsg(e.target.value)}
                      class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-cyan-500"
                    />
                    <button
                      onClick={showNotification}
                      class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs transition shadow-md shadow-cyan-500/20"
                    >
                      Toast
                    </button>
                  </div>
                </div>
              </div>

              {/* Hardware Telemetry */}
              <div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 flex flex-col gap-4">
                <h3 class="text-sm font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
                  <span>📱</span> Hardware & Substrate Telemetry
                </h3>
                <div class="space-y-2.5 text-xs">
                  <div class="flex justify-between items-center p-2.5 bg-slate-950/60 rounded-xl border border-slate-800/60">
                    <span class="text-slate-400">Runtime Substrate:</span>
                    <span class="font-mono text-cyan-400 font-semibold">{deviceInfo?.aetherEngine || "AETHER Cranelift / Dalvik Hybrid"}</span>
                  </div>
                  <div class="flex justify-between items-center p-2.5 bg-slate-950/60 rounded-xl border border-slate-800/60">
                    <span class="text-slate-400">CPU Compute Cores:</span>
                    <span class="font-mono text-white font-semibold">{deviceInfo?.cores || 8} Logical Cores</span>
                  </div>
                  <div class="flex justify-between items-center p-2.5 bg-slate-950/60 rounded-xl border border-slate-800/60">
                    <span class="text-slate-400">Viewport Dimensions:</span>
                    <span class="font-mono text-slate-200 font-semibold">{deviceInfo?.screen || "Auto-detecting"}</span>
                  </div>
                  <div class="flex justify-between items-center p-2.5 bg-slate-950/60 rounded-xl border border-slate-800/60">
                    <span class="text-slate-400">Memory Subsystem:</span>
                    <span class="font-mono text-emerald-400 font-semibold">{deviceInfo?.memory || "Unified Zero-Copy"}</span>
                  </div>
                  <div class="flex justify-between items-center p-2.5 bg-slate-950/60 rounded-xl border border-slate-800/60">
                    <span class="text-slate-400">Zero-SDK Compiler:</span>
                    <span class="font-mono text-emerald-400 font-bold">100% Active (Zero External Tools)</span>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Tab 2: Relational SQL Database */}
          {activeTab === 'db' && (
            <div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 flex flex-col gap-4">
              <div class="flex items-center justify-between flex-wrap gap-2">
                <div>
                  <h3 class="text-sm font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
                    <span>🗄️</span> Built-in AETHER SQL Engine (DB.*)
                  </h3>
                  <p class="text-xs text-slate-400 mt-0.5">High-speed relational table execution directly from React UI</p>
                </div>
                <span class="px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded-xl text-xs font-mono font-bold">
                  Latency: 0.04 ms
                </span>
              </div>

              {/* Add Record Form */}
              <form onSubmit={handleAddRecord} class="flex gap-2">
                <input
                  type="text"
                  placeholder="Enter new relational record or task..."
                  value={newTask}
                  onChange={(e) => setNewTask(e.target.value)}
                  class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-500"
                />
                <button
                  type="submit"
                  class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-xs transition shadow-md shadow-cyan-500/20 flex items-center gap-1.5"
                >
                  <span>➕</span> Add Record
                </button>
              </form>

              {/* SQL Table */}
              <div class="overflow-x-auto rounded-2xl border border-slate-800 bg-slate-950/70">
                <table class="w-full text-left text-xs">
                  <thead class="bg-slate-900/80 text-slate-400 uppercase text-[10px] tracking-wider border-b border-slate-800">
                    <tr>
                      <th class="py-3 px-4">ID</th>
                      <th class="py-3 px-4">Task Name / Operation</th>
                      <th class="py-3 px-4">Execution Latency</th>
                      <th class="py-3 px-4">Status</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800/60 font-mono">
                    {dbRecords.map((r) => (
                      <tr key={r.id} class="hover:bg-slate-900/50 transition">
                        <td class="py-2.5 px-4 text-cyan-400 font-bold">#{r.id}</td>
                        <td class="py-2.5 px-4 font-sans text-slate-200 font-medium">{r.task}</td>
                        <td class="py-2.5 px-4 text-slate-400">{r.latency}</td>
                        <td class="py-2.5 px-4">
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                            {r.status}
                          </span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* Tab 3: Autonomous AI */}
          {activeTab === 'ai' && (
            <div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 flex flex-col gap-4">
              <h3 class="text-sm font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
                <span>🤖</span> Autonomous AI Substrate (AI.*)
              </h3>
              <p class="text-xs text-slate-400">
                Native neural reasoning engine invoked directly through AetherBridge with zero external API keys needed.
              </p>
              <div class="space-y-3">
                <textarea
                  rows="3"
                  value={aiPrompt}
                  onChange={(e) => setAiPrompt(e.target.value)}
                  class="w-full bg-slate-950 border border-slate-700 rounded-2xl p-3 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 font-mono"
                  placeholder="Enter prompt for native AI..."
                />
                <button
                  onClick={handleRunAi}
                  disabled={isAiLoading}
                  class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold px-6 py-2.5 rounded-xl text-xs transition shadow-lg shadow-cyan-500/20 flex items-center gap-2"
                >
                  {isAiLoading ? "⚡ Inferring..." : "✨ Run Native AI Inference"}
                </button>
              </div>

              {aiResponse && (
                <div class="mt-2 p-4 bg-slate-950/80 rounded-2xl border border-cyan-500/30 text-xs">
                  <div class="font-bold text-cyan-400 mb-1 flex items-center gap-1.5">
                    <span>🧠</span> Native AI Output:
                  </div>
                  <p class="text-slate-300 font-mono leading-relaxed">{aiResponse}</p>
                </div>
              )}
            </div>
          )}

          {/* Architectural Comparison Matrix */}
          <section class="bg-slate-900/40 border border-slate-800/80 rounded-3xl p-6">
            <h3 class="text-sm font-bold uppercase tracking-wider text-slate-300 mb-3 flex items-center gap-2">
              <span>⚖️</span> Architecture Comparison: AETHER vs Tauri vs React Native
            </h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-950/80 text-slate-400 border-b border-slate-800 text-[10px] uppercase tracking-wider">
                  <tr>
                    <th class="py-2.5 px-3">Feature</th>
                    <th class="py-2.5 px-3 text-cyan-400 font-bold">AETHER 2.0</th>
                    <th class="py-2.5 px-3">Tauri (Mobile)</th>
                    <th class="py-2.5 px-3">React Native</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/40 text-slate-300">
                  <tr>
                    <td class="py-2.5 px-3 font-semibold">Android Studio Required?</td>
                    <td class="py-2.5 px-3 text-emerald-400 font-bold">NO (0 MB, Built-in)</td>
                    <td class="py-2.5 px-3 text-rose-400">YES (15+ GB SDK)</td>
                    <td class="py-2.5 px-3 text-rose-400">YES (15+ GB SDK)</td>
                  </tr>
                  <tr>
                    <td class="py-2.5 px-3 font-semibold">Build Time to APK</td>
                    <td class="py-2.5 px-3 text-emerald-400 font-bold">&lt; 1 Second</td>
                    <td class="py-2.5 px-3 text-amber-400">4 - 8 Minutes</td>
                    <td class="py-2.5 px-3 text-amber-400">5 - 12 Minutes</td>
                  </tr>
                  <tr>
                    <td class="py-2.5 px-3 font-semibold">Dalvik Bytecode Synthesis</td>
                    <td class="py-2.5 px-3 text-emerald-400 font-bold">Pure Rust Built-in</td>
                    <td class="py-2.5 px-3 text-slate-500">Gradle / Java</td>
                    <td class="py-2.5 px-3 text-slate-500">Gradle / JVM</td>
                  </tr>
                  <tr>
                    <td class="py-2.5 px-3 font-semibold">Built-in Relational SQL</td>
                    <td class="py-2.5 px-3 text-emerald-400 font-bold">YES (DB.* Engine)</td>
                    <td class="py-2.5 px-3 text-slate-500">Plugin Required</td>
                    <td class="py-2.5 px-3 text-slate-500">Third-Party NPM</td>
                  </tr>
                  <tr>
                    <td class="py-2.5 px-3 font-semibold">Multi-Platform Bundler</td>
                    <td class="py-2.5 px-3 text-emerald-400 font-bold">APK + EXE + HTML</td>
                    <td class="py-2.5 px-3 text-slate-300">EXE + APK (Complex)</td>
                    <td class="py-2.5 px-3 text-slate-300">APK / iOS Only</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>

          {/* Footer */}
          <footer class="text-center text-xs text-slate-500">
            AETHER 2.0 Omni Shell • Universal Native Compilation Engine • Zero External Toolchains
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
