<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6" />

  <!-- Outer Glowing Clock Rim -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ringGrad)" stroke-width="12" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="165" fill="#090d16" stroke="#1e293b" stroke-width="4" />

  <!-- Clock Hour Ticks -->
  <line x1="256" y1="105" x2="256" y2="125" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="387" x2="256" y2="407" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" />
  <line x1="105" y1="256" x2="125" y2="256" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" />
  <line x1="387" y1="256" x2="407" y2="256" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" />

  <!-- Clock Hands -->
  <line x1="256" y1="256" x2="190" y2="180" stroke="#f8fafc" stroke-width="10" stroke-linecap="round" />
  <line x1="256" y1="256" x2="330" y2="160" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" filter="url(#neonGlow)" />
  <line x1="256" y1="275" x2="256" y2="140" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" />

  <!-- Center Pivot Core -->
  <circle cx="256" cy="256" r="14" fill="#00f2fe" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="6" fill="#f8fafc" />

  <!-- Cognitive Heartbeat Pulse Wave at Bottom -->
  <path d="M 140 330 L 200 330 L 220 290 L 240 365 L 260 270 L 280 345 L 300 330 L 372 330" fill="none" stroke="url(#pulseGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />
</svg>
