<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e17"/>
      <stop offset="50%" stop-color="#121726"/>
      <stop offset="100%" stop-color="#070910"/>
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="iris-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#00f5ff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>

  <!-- Subtle Inner Border -->
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="url(#ring-grad)" stroke-width="2" opacity="0.35"/>

  <!-- Quantum Neural Orbitals -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Orbit 1 -->
    <ellipse cx="0" cy="0" rx="140" ry="75" fill="none" stroke="url(#ring-grad)" stroke-width="8" transform="rotate(-30)" stroke-dasharray="8 6"/>
    <!-- Orbit 2 -->
    <ellipse cx="0" cy="0" rx="140" ry="75" fill="none" stroke="url(#ring-grad)" stroke-width="8" transform="rotate(30)"/>
    <!-- Orbit 3 -->
    <ellipse cx="0" cy="0" rx="140" ry="75" fill="none" stroke="url(#ring-grad)" stroke-width="8" transform="rotate(90)" opacity="0.6"/>

    <!-- Outer Hexagonal Nodes -->
    <circle cx="-120" cy="-70" r="10" fill="#00f5ff"/>
    <circle cx="120" cy="70" r="10" fill="#a855f7"/>
    <circle cx="0" cy="-140" r="8" fill="#38bdf8"/>
    <circle cx="0" cy="140" r="8" fill="#6366f1"/>

    <!-- Central Glowing Iris -->
    <circle cx="0" cy="0" r="54" fill="url(#core-glow)"/>
    <circle cx="0" cy="0" r="28" fill="#ffffff"/>
    <circle cx="0" cy="0" r="16" fill="#0c0e17"/>
    <circle cx="0" cy="0" r="8" fill="#00f5ff"/>
  </g>
</svg>
