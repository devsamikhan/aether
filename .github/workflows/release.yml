name: Production Release & Cross-Platform Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build & Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: aether
            archive_name: aether-linux-x86_64.tar.gz
            direct_binary: aether-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: aether
            archive_name: aether-macos-universal.tar.gz
            direct_binary: aether-macos-universal
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: aether.exe
            archive_name: aether-windows-x86_64.zip
            direct_binary: aether-windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify All Test Suites (100% Pass Required)
        run: cargo test --release --verbose

      - name: Build Optimized Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Release Assets (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          DIST_DIR="aether-release"
          mkdir -p "$DIST_DIR/bin"
          mkdir -p "$DIST_DIR/libraries"
          
          # Copy executable and standard libraries
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$DIST_DIR/bin/"
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ${{ matrix.direct_binary }}
          cp libraries/*.ae "$DIST_DIR/libraries/" 2>/dev/null || true
          cp README.md LICENSE install.sh "$DIST_DIR/" 2>/dev/null || true
          
          # Create compressed tarball
          tar -czvf ${{ matrix.archive_name }} -C "$DIST_DIR" .
          
          # Generate SHA256 checksums
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.archive_name }} > ${{ matrix.archive_name }}.sha256
            sha256sum ${{ matrix.direct_binary }} > ${{ matrix.direct_binary }}.sha256
          else
            shasum -a 256 ${{ matrix.archive_name }} > ${{ matrix.archive_name }}.sha256
            shasum -a 256 ${{ matrix.direct_binary }} > ${{ matrix.direct_binary }}.sha256
          fi

      - name: Package Release Assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $DistDir = "aether-release"
          New-Item -ItemType Directory -Path "$DistDir\bin" -Force | Out-Null
          New-Item -ItemType Directory -Path "$DistDir\libraries" -Force | Out-Null
          
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.binary_name }}" "$DistDir\bin\"
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.binary_name }}" "${{ matrix.direct_binary }}"
          if (Test-Path "libraries") { Copy-Item "libraries\*.ae" "$DistDir\libraries\" }
          Copy-Item "README.md", "LICENSE", "install.ps1" "$DistDir\" -ErrorAction SilentlyContinue
          
          Compress-Archive -Path "$DistDir\*" -DestinationPath "${{ matrix.archive_name }}" -Force
          
          $Hash = (Get-FileHash "${{ matrix.archive_name }}" -Algorithm SHA256).Hash
          "$Hash  ${{ matrix.archive_name }}" | Out-File -FilePath "${{ matrix.archive_name }}.sha256" -Encoding ascii
          
          $BinHash = (Get-FileHash "${{ matrix.direct_binary }}" -Algorithm SHA256).Hash
          "$BinHash  ${{ matrix.direct_binary }}" | Out-File -FilePath "${{ matrix.direct_binary }}.sha256" -Encoding ascii

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256
            ${{ matrix.direct_binary }}
            ${{ matrix.direct_binary }}.sha256
            install.sh
            install.ps1
          name: "AETHER ${{ github.ref_name }} — Production Release"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
